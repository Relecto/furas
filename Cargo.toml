[package]
name = "furas"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "furas"
crate-type = ["cdylib", "rlib"]

[dependencies]
itertools = "0.14.0"
nucleo-matcher = "0.3.1"
pyo3 = "0.27.0"
rapidfuzz = "0.5.0"
regex = "1.12.3"
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strsim = "0.11.1"
